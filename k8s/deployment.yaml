apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-2306275310-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insurance-2306275310-be
  template:
    metadata:
      labels:
        app: insurance-2306275310-be
    spec:
      containers:
        - name: springboot-container
          image: khaylanaura/insurance-be:latest # Pastikan tag image benar
          ports:
            - containerPort: 8080
          env:
            # --- DATABASE CONFIG (Biasanya dari ConfigMap) ---
            - name: DATABASE_URL_PROD
              valueFrom:
                configMapKeyRef:
                  name: insurance-2306275310-config
                  key: DATABASE_URL_PROD
            - name: DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: insurance-2306275310-config
                  key: DATABASE_USERNAME
            
            # --- SECRETS & SENSITIVE DATA (Dari Secret) ---
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insurance-2306275310-secret
                  key: DATABASE_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: insurance-2306275310-secret
                  key: JWT_SECRET_KEY
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: insurance-2306275310-secret
                  key: CORS_ALLOWED_ORIGINS

            # --- EXTERNAL SERVICE URLs (Dari CI/CD Variables -> Secret) ---
            - name: PROFILE_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: insurance-2306275310-secret
                  key: PROFILE_SERVICE_URL
            
            - name: FLIGHT_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: insurance-2306275310-secret
                  key: FLIGHT_SERVICE_URL
            
            - name: ACCOMMODATION_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: insurance-2306275310-secret
                  key: ACCOMMODATION_SERVICE_URL
            
            - name: BILLING_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: insurance-2306275310-secret
                  key: BILLING_SERVICE_URL
            
            - name: RENTAL_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: insurance-2306275310-secret
                  key: RENTAL_SERVICE_URL
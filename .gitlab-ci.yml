stages:
  - build
  - docker-push
  - deploy

variables:
  # Nama image Docker Hub (misal: khaylanaura/insurance-2306275310-be)
  DOCKER_IMAGE_NAME: ${DOCKER_IMAGE_NAME} 
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA # Menggunakan 8 karakter pertama dari commit hash

# --- STAGE 1: BUILD ---
build:
  stage: build
  image: eclipse-temurin:21-jdk
  script:
    - chmod +x ./gradlew
    - ./gradlew clean build -x test
    # Mengambil JAR file yang baru dibuat
    - cp $(find build/libs -name "*.jar" | head -n 1) app.jar
  artifacts:
    paths:
      - app.jar
      - Dockerfile
      - k8s/deployment.yaml
      - k8s/service.yaml
    expire_in: 1 hour

# --- STAGE 2: DOCKER PUSH ---
docker-push:
  stage: docker-push
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--insecure-registry", "registry-1.docker.io"]
  dependencies:
    - build
  before_script:
    # Login ke Docker Hub menggunakan Variabel CI/CD
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    # 1. Build image dengan tag $CI_COMMIT_SHORT_SHA
    - docker build -t $DOCKER_IMAGE_NAME:$IMAGE_TAG .
    # 2. Push image ke Docker Hub
    - docker push $DOCKER_IMAGE_NAME:$IMAGE_TAG
  only:
    # Ubah branch ini jika kamu menggunakan branch CI/CD yang berbeda
    - feat/praktikum-9

# --- STAGE 3: DEPLOY ---
deploy:
  stage: deploy
  image: alpine:latest
  dependencies:
    - docker-push
  before_script:
    # Instalasi tools SSH
    - apk add --no-cache openssh bash
    - mkdir -p ~/.ssh
    - echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    # 1. Generate ConfigMap & Secret on-the-fly (Menggunakan Variabel CI/CD)
    - echo "Generating Kubernetes ConfigMap & Secret via printf..."
    # ConfigMap untuk INSURANCE
    - |
      printf "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: insurance-2306275310-config\n  namespace: default\ndata:\n  DATABASE_URL_PROD: \"%s\"\n  DATABASE_USERNAME: \"%s\"\n" \
      "$DATABASE_URL_PROD" "$DATABASE_USERNAME" > configmap.yaml
    # Secret untuk INSURANCE
    - |
      printf "apiVersion: v1\nkind: Secret\nmetadata:\n  name: insurance-2306275310-secret\n  namespace: default\ntype: Opaque\nstringData:\n  DATABASE_PASSWORD: \"%s\"\n  JWT_SECRET_KEY: \"%s\"\n  CORS_ALLOWED_ORIGINS: \"%s\"\n" \
      "$DATABASE_PASSWORD" "$JWT_SECRET_KEY" "$CORS_ALLOWED_ORIGINS" > secret.yaml

    # 2. Update Tag Image di Deployment YAML
    # Asumsi file k8s/deployment.yaml adalah file aslinya (sidating)
    # File aslinya di history percakapan adalah 'insurance-k8s-deployment.yaml'
    # Kita akan menggunakan file 'k8s/deployment.yaml' dan mencari teks 'REPLACE_ME_TAG'
    - sed "s|REPLACE_ME_TAG|$IMAGE_TAG|g" k8s/deployment.yaml > deployment.yaml
    
    # 3. Copy file k8s (Ingress, Service, Deployment, ConfigMap, Secret) ke server
    - echo "Creating -> deployment.yaml, configmap.yaml, secret.yaml, service.yaml, ingress.yaml"
    - ssh $EC2_USER@$EC2_HOST "mkdir -p ~/app/insurance-2306275310/k8s"
    - scp deployment.yaml configmap.yaml secret.yaml k8s/service.yaml k8s/ingress.yaml $EC2_USER@$EC2_HOST:~/app/insurance-2306275310/k8s/

    # 4. Apply konfigurasi di K3S dan cek status rollout
    - |
      ssh $EC2_USER@$EC2_HOST "
        # Apply semua file YAML di folder k8s
        sudo k3s kubectl apply -f ~/app/insurance-2306275310/k8s/ &&
        # Cek status rollout deployment insurance
        sudo k3s kubectl rollout status deployment/insurance-2306275310-deployment -n default
      "
  only:
    # Ubah branch ini jika kamu menggunakan branch CI/CD yang berbeda
    - feat/praktikum-9